name: Build cIOS

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # "MAJOR MINOR" for maked2x.sh. Set the repository variable D2X_VERSION
      # (or the older VERSION secret) to name release builds.
      D2X_VERSION: ${{ vars.D2X_VERSION || secrets.VERSION || '999 ci' }}
      # A warning fails the build.
      EXTRA_CFLAGS: -Werror
    steps:
      - uses: actions/checkout@v4

      # The same pinned image (docker/Dockerfile) as a local tools/build.sh.
      - name: Compile cIOS
        run: |
          tools/build.sh $D2X_VERSION
          echo "upload_name=v${D2X_VERSION}-$(git rev-parse --short=7 HEAD)" | tr ' ' '-' >> "$GITHUB_ENV"

      - name: Test
        run: tools/build.sh test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2x-${{ env.upload_name }}
          path: build
